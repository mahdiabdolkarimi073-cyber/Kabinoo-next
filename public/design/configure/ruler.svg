    <!-- 70cm -->
    <line x1="10" y1="498.24" x2="40" y2="498.24"/>
    <text x="45" y="503.24" font-family="Yekan Bakh" font-size="16" fill="#000">70 cm</text>
    
    <!-- 80cm -->
    <line x1="10" y1="449.41" x2="40" y2="449.41"/>
    <text x="45" y="454.41" font-family="Yekan Bakh" font-size="16" fill="#000">80 cm</text>
    
    <!-- 90cm -->
