    <!-- 120cm -->
    <line x1="10" y1="254.12" x2="40" y2="254.12"/>
    <text x="45" y="259.12" font-family="Yekan Bakh" font-size="16" fill="#000">120 cm</text>
    
    <!-- 130cm -->
    <line x1="10" y1="205.29" x2="40" y2="205.29"/>
