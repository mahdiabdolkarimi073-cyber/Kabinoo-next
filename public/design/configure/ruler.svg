    <line x1="10" y1="473.125" x2="30" y2="473.125"/>
    <line x1="10" y1="521.875" x2="30" y2="521.875"/>
    <line x1="10" y1="570.625" x2="30" y2="570.625"/>
    <line x1="10" y1="619.375" x2="30" y2="619.375"/>
