<svg width="100" height="850" viewBox="0 0 100 850" xmlns="http://www.w3.org/2000/svg">
  <!-- Ruler background -->
  <rect x="10" y="10" width="60" height="830" fill="none" stroke="none"/>
  <!-- Bottom border only -->
  <line x1="10" y1="840" x2="70" y2="840" stroke="#333" stroke-width="2"/>
  
  <!-- Major tick marks every 10cm -->
  <g stroke="#000" stroke-width="2">
    <!-- 0cm -->
    <line x1="10" y1="840" x2="40" y2="840"/>
    <text x="15" y="837" font-family="Yekan Bakh" font-size="16" fill="#000">0 cm</text>
    
    <!-- 10cm -->
    <line x1="10" y1="791.18" x2="40" y2="791.18"/>
    <text x="45" y="796.18" font-family="Yekan Bakh" font-size="16" fill="#000">10 cm</text>
    
    <!-- 20cm -->
    <line x1="10" y1="742.35" x2="40" y2="742.35"/>
